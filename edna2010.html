<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="google" content="notranslate">
<title>20/10 3D — Ngày Phụ nữ Việt Nam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
  :root{--cream:#fdf6ef;--serif:"Playfair Display",Georgia,serif;--script:"Dancing Script","Segoe Script",cursive}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:var(--serif);background:#070110;color:#fff;overflow:hidden}
  #app{position:fixed;inset:0;touch-action:none}
  #app canvas{display:block}

  .hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;
    justify-content:space-between;padding:max(18px,env(safe-area-inset-top)) 18px max(22px,env(safe-area-inset-bottom));z-index:10}
  .hud-top{text-align:center;transition:opacity 1s ease}
  .hud-top.hide{opacity:0}
  .title{font-family:var(--script);font-size:clamp(26px,7vw,38px);color:#ffd9ec;
    text-shadow:0 0 24px rgba(255,120,190,.85);margin-top:2px}
  .intro-btn{margin-top:clamp(20px,6vh,46px);padding:13px 30px;border-radius:999px;color:#fff;pointer-events:auto;
    background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.45);backdrop-filter:blur(6px);
    font-size:15px;letter-spacing:.05em;animation:breathe 2.2s ease-in-out infinite;transition:opacity .6s}
  .intro-btn:active{transform:scale(.96)}
  /* line dọc — cấp độ theo màu */
  .level-line{position:fixed;right:16px;top:50%;transform:translateY(-50%);width:4px;height:36vh;border-radius:4px;
    background:rgba(255,255,255,.14);overflow:hidden;opacity:0;transition:opacity 1s ease;pointer-events:none;z-index:12}
  .level-line.show{opacity:1}
  .level-line i{position:absolute;bottom:0;left:0;width:100%;height:0;border-radius:4px;background:var(--lvl,#5a3d7a);
    transition:height .5s ease,background .5s ease;box-shadow:0 0 14px var(--lvl,#5a3d7a)}

  /* node 0 — thiệp QR */
  #qrScreen{position:fixed;inset:0;z-index:40;display:grid;place-items:center;
    background:rgba(30,8,40,.35);backdrop-filter:blur(10px);transition:opacity .7s ease;cursor:pointer}
  #qrScreen.gone{opacity:0;pointer-events:none}
  .qr-card{position:relative;background:var(--cream);border-radius:14px;padding:22px 22px 16px;
    box-shadow:0 30px 70px rgba(0,0,0,.45);transform:rotate(-2deg);transition:transform .7s cubic-bezier(.22,1.2,.36,1)}
  #qrScreen.gone .qr-card{transform:rotate(-2deg) scale(1.25)}
  #qrCanvas{display:block;border-radius:8px;max-width:54vw;height:auto}
  .tape{position:absolute;top:-13px;left:-24px;width:104px;height:28px;background:rgba(214,38,79,.85);
    transform:rotate(-38deg);border-radius:2px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
  .qr-cap{text-align:center;margin-top:12px;font-size:14px;color:#7a4a5e}
  .qr-hint{position:absolute;bottom:14%;left:0;right:0;text-align:center;font-size:13px;color:#ffd9ec;
    text-shadow:0 0 12px rgba(255,120,180,.8);animation:breathe 2.2s ease-in-out infinite}

  /* node 7 — header panel */
  .panel-head{position:fixed;left:0;right:0;top:23%;text-align:center;pointer-events:none;z-index:11;
    opacity:0;transition:opacity 1.2s ease}
  .panel-head.show{opacity:1}
  .panel-title{font-family:var(--script);font-size:clamp(22px,6vw,30px);color:#ffd9ec;
    text-shadow:0 0 20px rgba(255,120,190,.9);margin-top:2px}

  /* node 8 — chớp sáng chuyển thư */
  #flash{position:fixed;inset:0;z-index:60;pointer-events:none;opacity:0;
    background:radial-gradient(circle at 50% 45%, #fff, #ff9fd0 45%, #d13a8f 100%)}

  #fallback{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:30px;background:#2b0f3d;z-index:99}
  #fallback a{color:#ffb8dd}

  #letterModal{position:fixed;inset:0;display:grid;place-items:center;padding:18px;z-index:50;
    background:rgba(20,3,32,.6);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .6s ease}
  #letterModal.show{opacity:1;pointer-events:auto}
  .letter{width:min(92vw,400px);background:var(--cream);color:#4a3540;
    border-radius:14px;padding:26px 24px 30px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.6);
    transform:translateY(28px) scale(.96);transition:transform .6s cubic-bezier(.22,1.2,.36,1)}
  #letterModal.show .letter{transform:none}
  /* thiệp lắp ráp: từng mảnh nội dung bay từ rải rác về vị trí */
  .letter > *{opacity:0;transform:translate(var(--dx,0),var(--dy,0)) rotate(var(--dr,0deg)) scale(.55);
    transition:opacity .55s ease,transform .7s cubic-bezier(.22,1.1,.36,1)}
  #letterModal.show .letter > *{opacity:1;transform:none}
  #letterModal.show .letter > *:nth-child(1){transition-delay:.15s}
  #letterModal.show .letter > *:nth-child(2){transition-delay:.3s}
  #letterModal.show .letter > *:nth-child(3){transition-delay:.45s}
  #letterModal.show .letter > *:nth-child(4){transition-delay:.6s}
  #letterModal.show .letter > *:nth-child(5){transition-delay:.75s}
  /* mảnh tim bay vào lắp ráp thành thiệp */
  #shards{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .shard{position:absolute;left:50%;top:50%;width:24px;height:24px;border-radius:5px;opacity:.95;
    background:linear-gradient(135deg,#ff5f8f,#c0308c);box-shadow:0 0 16px rgba(255,120,180,.95)}
  .polaroid{width:60%;margin:0 auto 16px;background:#fff;padding:9px 9px 28px;border-radius:4px;
    box-shadow:0 10px 26px rgba(90,50,70,.25);transform:rotate(-2.5deg)}
  .polaroid .photo{aspect-ratio:3/4;border-radius:2px;display:grid;place-items:center;font-size:44px;
    background:linear-gradient(150deg,#e8b7d4,#b47ad0);color:#fff}
  .polaroid img{width:100%;height:100%;object-fit:contain;display:block;background:#fdf6f2}
  .letter h2{font-family:var(--script);font-size:26px;color:#c2497f;margin-bottom:10px}
  .letter p{font-size:15.5px;line-height:1.8;font-style:italic;color:#6b4f5e;white-space:pre-line}
  .sign{margin-top:20px;font-family:var(--script);font-size:26px;color:#c2497f}
  .close-btn{margin-top:20px;padding:11px 26px;border-radius:999px;background:#c2497f;color:#fff;font-size:14px;
    box-shadow:0 8px 20px rgba(194,73,127,.4)}
  @keyframes breathe{0%,100%{opacity:.75}50%{opacity:1}}
</style>
</head>
<body>

<div id="app"></div>

<!-- node 0 — thiệp QR mở đầu -->
<div id="qrScreen">
  <div class="qr-card">
    <div class="tape"></div>
    <canvas id="qrCanvas" width="220" height="220"></canvas>
    <div class="qr-cap" id="qrCap"></div>
  </div>
  <div class="qr-hint">Chạm để mở thiệp 🌹</div>
</div>

<div class="hud">
  <div class="hud-top">
    <div class="title">Ngày Phụ nữ Việt Nam 🌹</div>
    <button class="intro-btn" id="introBtn">Chạm để mở quà 🌹</button>
  </div>
</div>

<!-- line dọc — cấp độ nhịp theo màu -->
<div class="level-line" id="levelLine"><i id="levelFill"></i></div>


<!-- node 7 — header panel -->
<div class="panel-head" id="panelHead">
  <div class="panel-title" id="panelTitle"></div>
</div>

<!-- node 8 — chớp -->
<div id="flash"></div>

<div id="fallback">
  <div>
    <p style="font-size:40px">🌹</p>
    <p>Trang 3D cần mạng để tải thư viện.<br>Anh thử mở lại khi có mạng.</p>
  </div>
</div>

<div id="letterModal" role="dialog" aria-modal="true" aria-label="Thư tay">
  <div id="shards" aria-hidden="true"></div>
  <div class="letter">
    <div class="polaroid" id="polaroid"><div class="photo">💗</div></div>
    <h2 id="letterTo"></h2>
    <p id="letterBody"></p>
    <div class="sign" id="letterSign"></div>
    <button class="close-btn" id="closeLetter">Xong! Đóng lại</button>
  </div>
</div>

<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
/* ====== CẤU HÌNH ====== */
const CONFIG = {
  to: "Bé Hoa",
  from: "Anh Simeon",
  qrCaption: "Quà 20/10 cho Bé Hoa 🌹",
  panelTitle: "Gửi tim bé của anh ❤️",
  bubbles: ["Yêu thương 💕", "I love u 💖", "Nhớ em nhiều 🌹", "Hạnh phúc 🎀"],
  wishes: [
    "Chúc em mãi xinh đẹp 🌹", "Yêu em nhiều ❤️", "20/10 hạnh phúc 🎀",
    "Luôn rực rỡ ✨", "Luôn mỉm cười 😊", "Em là hoa hồng của anh 🌹"
  ],
  photos: [
    "img/1792498355296_8248084726404571584_8248084726404571584_ef767e6ffa3b3646bd6a92a9ed4ee47a.jpg",
    "img/1792498355336_8248084726404571584_8248084726404571584_23391e1161f1d4a7b3d1edc94ab2f4d3.jpg",
    "img/1792498355358_8248084726404571584_8248084726404571584_cef68332d03cd77caf7069e4ceae93cf.jpg",
    "img/1792498355376_8248084726404571584_8248084726404571584_9c0d96ce4136c2dd5f9786800911ff96.jpg",
    "img/1792498355393_8248084726404571584_8248084726404571584_abffe9bf73e4bdb5a62f9b2a01ee4e9f.jpg",
    "img/1792498355409_8248084726404571584_8248084726404571584_86742e02ace0397eb478ad1798e02edd.jpg",
    "img/1792498355422_8248084726404571584_8248084726404571584_1317f75ccd3d710306b20979ae9cd547.jpg",
    "img/1792498355434_8248084726404571584_8248084726404571584_0005946b3effa1ac27534acba02c8720.jpg"
  ],
  letter: "20/10 hạnh phúc em nhé 🌹\nChúc Bé Hoa luôn rực rỡ, xinh đẹp và cười thật nhiều.\nYêu em nhiều!"
};
const BEATS = 5;

try {
  await import("three");
  await import("three/addons/controls/OrbitControls.js");
} catch (e) {
  document.querySelector("#fallback").style.display = "grid";
  throw e;
}
const THREE = await import("three");
const { OrbitControls } = await import("three/addons/controls/OrbitControls.js");
const { EffectComposer } = await import("three/addons/postprocessing/EffectComposer.js");
const { RenderPass } = await import("three/addons/postprocessing/RenderPass.js");
const { UnrealBloomPass } = await import("three/addons/postprocessing/UnrealBloomPass.js");

const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp01 = x => Math.max(0, Math.min(1, x));
const easeInOut = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2;
const easeOut = x => 1 - Math.pow(1 - x, 3);
const mobile = Math.min(innerWidth, innerHeight) < 600;

$("#qrCap").textContent = CONFIG.qrCaption;
$("#panelTitle").textContent = CONFIG.panelTitle;

/* ====== Âm thanh ====== */
let audioCtx;
function chime(freq = 660, dur = .25, vol = .16) {
  try {
    audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(.001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(vol, audioCtx.currentTime + .02);
    g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}

/* ====== Scene cơ bản ====== */
const app = $("#app");
const scene = new THREE.Scene();
scene.background = new THREE.Color("#070110");
scene.fog = new THREE.FogExp2("#0a0318", 0.018);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 300);
const renderer = new THREE.WebGLRenderer({ antialias: !mobile });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
app.appendChild(renderer.domElement);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), .85, .7, .2);
composer.addPass(bloom);
bloom.strength = .2;    // nền sáng lúc mở đầu — bloom nhẹ, tăng dần khi bay

/* ====== Nền SÁNG lúc mở đầu (tím→hồng) — gắn vào camera ====== */
function introBackdropTexture() {
  const c = document.createElement("canvas");
  c.width = c.height = 512;
  const g = c.getContext("2d");
  const v = g.createLinearGradient(0, 0, 0, 512);
  v.addColorStop(0, "#370b64");
  v.addColorStop(.45, "#7d1a94");
  v.addColorStop(.78, "#c6278f");
  v.addColorStop(1, "#f0559f");
  g.fillStyle = v; g.fillRect(0, 0, 512, 512);
  const r = g.createRadialGradient(256, 258, 8, 256, 258, 195);
  r.addColorStop(0, "rgba(255,244,248,.6)");
  r.addColorStop(.4, "rgba(255,190,220,.26)");
  r.addColorStop(1, "rgba(255,150,200,0)");
  g.fillStyle = r; g.fillRect(0, 0, 512, 512);
  return new THREE.CanvasTexture(c);
}
const introBackdrop = new THREE.Mesh(
  new THREE.PlaneGeometry(70, 70),
  new THREE.MeshBasicMaterial({ map: introBackdropTexture(), transparent: true, opacity: 1,
    fog: false, depthWrite: false })
);
introBackdrop.renderOrder = -10;
introBackdrop.position.z = -20;
function fitBackdrop() {
  const d = 20;
  const h = 2 * d * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2) * 1.2;
  introBackdrop.scale.set(h * camera.aspect / 70, h / 70, 1);
}
fitBackdrop();
camera.add(introBackdrop);
scene.add(camera);

/* ====== Ánh sáng ====== */
scene.add(new THREE.AmbientLight("#5a2a7a", .9));
const keyLight = new THREE.DirectionalLight("#fff0f5", 1.5);
keyLight.position.set(3, 6, 4);
scene.add(keyLight);
const glowLight = new THREE.PointLight("#ff2d78", 9, 0, 2);
glowLight.position.set(0, .35, 0);
scene.add(glowLight);
const orbitLightA = new THREE.PointLight("#ff7bb0", 30, 0, 2);
const orbitLightB = new THREE.PointLight("#ffd28a", 20, 0, 2);
scene.add(orbitLightA, orbitLightB);

/* ====== Chấm sáng tròn ====== */
function glowTexture() {
  const c = document.createElement("canvas");
  c.width = c.height = 128;
  const g = c.getContext("2d");
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, "rgba(255,255,255,1)");
  gr.addColorStop(.4, "rgba(255,180,220,.7)");
  gr.addColorStop(1, "rgba(255,120,190,0)");
  g.fillStyle = gr;
  g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}
const glowTex = glowTexture();

/* ====== Bông hồng 3D — xoắn ốc liên tục ====== */
function petalGeometry({ segU = 16, segV = 20, length = 1, width = .62, cup = .4, belly = .28, curl = 1 } = {}) {
  const positions = [], colors = [], indices = [];
  const cBase = new THREE.Color("#5c0518"), cMid = new THREE.Color("#c4123f"), cEdge = new THREE.Color("#ff5f8f");
  for (let j = 0; j <= segV; j++) {
    const v = j / segV;
    const base = Math.pow(v, .45) * (1 - .35 * v);
    const tip = v < .72 ? 1 : Math.sqrt(Math.max(0, 1 - Math.pow((v - .72) / .28, 2)));
    const hw = width * .5 * base * tip + .012;
    const bend = curl * Math.pow(v, 2.1);
    const cb = Math.cos(bend), sb = Math.sin(bend);
    for (let i = 0; i <= segU; i++) {
      const xn = (i / segU - .5) * 2;
      const x = xn * hw;
      const y = v * length;
      const z = belly * Math.sin(Math.PI * Math.min(v * 1.15, 1)) * .55 - cup * xn * xn * hw;
      positions.push(x, y * cb - z * sb, y * sb + z * cb);
      const t = Math.min(1, .25 + .75 * Math.max(v * .75, Math.abs(xn) * .55));
      const c = cBase.clone().lerp(cMid, Math.min(1, t * 1.5)).lerp(cEdge, Math.max(0, t - .55) * 2.2);
      colors.push(c.r, c.g, c.b);
    }
  }
  const row = segU + 1;
  for (let j = 0; j < segV; j++) for (let i = 0; i < segU; i++) {
    const a = j * row + i;
    indices.push(a, a + row, a + 1, a + 1, a + row, a + row + 1);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}

const petalMat = new THREE.MeshStandardMaterial({
  vertexColors: true, side: THREE.DoubleSide, roughness: .5, metalness: .05,
  emissive: new THREE.Color("#3a0318"), emissiveIntensity: .18
});
const greenMat = new THREE.MeshStandardMaterial({ color: "#2f7d3a", side: THREE.DoubleSide, roughness: .65 });

function makeRose() {
  const rose = new THREE.Group();
  const N = 38;                                     // xoắn ốc liên tục như hồng thật
  let angle = rand(0, 6.28);
  for (let i = 0; i < N; i++) {
    const f = i / (N - 1);
    const s = .5 + .82 * Math.pow(f, 1.1);
    const geo = petalGeometry({
      length: s,
      width: .7 * s + .08,
      cup: .58 - .3 * f,
      belly: .30 - .08 * f,
      curl: .32 + .48 * f
    });
    const mesh = new THREE.Mesh(geo, petalMat);
    mesh.rotation.x = .07 + .95 * Math.pow(f, 1.25);
    mesh.rotation.z = rand(-.09, .09);
    mesh.position.set(0, -.02 * i, .03 + .22 * f);
    const pivot = new THREE.Group();
    pivot.rotation.y = angle;
    angle += 2.39996;                                      // 137.5°
    pivot.add(mesh);
    rose.add(pivot);
  }
  for (let k = 0; k < 5; k++) {                            // đài hoa
    const sep = new THREE.Mesh(petalGeometry({ length: .5, width: .24, cup: .22, belly: .06, curl: .85 }), greenMat);
    sep.rotation.x = 2.4;
    const pivot = new THREE.Group();
    pivot.rotation.y = k * 1.2567 + .6;
    sep.position.set(0, -.07, .1);
    pivot.add(sep);
    rose.add(pivot);
  }
  const core = new THREE.Mesh(new THREE.SphereGeometry(.055, 12, 12),
    new THREE.MeshBasicMaterial({ color: "#ffdf8e", transparent: true }));
  core.position.y = .1;
  rose.add(core);
  rose.userData.coreMat = core.material;
  return rose;
}

const roseGroup = new THREE.Group();
const flower = makeRose();
roseGroup.add(flower);
const stemCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0, -.08, 0), new THREE.Vector3(.06, -.7, .04),
  new THREE.Vector3(-.05, -1.4, -.05), new THREE.Vector3(.1, -2.2, .06)
]);
roseGroup.add(new THREE.Mesh(new THREE.TubeGeometry(stemCurve, 24, .035, 8), greenMat));
[[.28, 2.3, .9], [.62, -2.1, .8], [1.0, 2.6, .7]].forEach(([p, az, s]) => {
  const leaf = new THREE.Mesh(petalGeometry({ length: s, width: .34 * s, cup: .18, belly: .05, curl: .35 }), greenMat);
  const pivot = new THREE.Group();
  pivot.rotation.y = az;
  leaf.rotation.x = 2.0;
  leaf.position.set(0, 0, .05);
  pivot.add(leaf);
  pivot.position.copy(stemCurve.getPoint(p));
  roseGroup.add(pivot);
});
roseGroup.position.set(0, .1, 0);
roseGroup.rotation.z = .05;
scene.add(roseGroup);

/* ====== Trái tim 3D hạt sáng ====== */
const COUNT = mobile ? 3500 : 6000;
function buildHeart(count) {
  const base = new Float32Array(count * 3), scatter = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  const cIn = new THREE.Color("#fff0f7"), cOut = new THREE.Color("#ff2d78");
  for (let i = 0; i < count; i++) {
    const t = Math.random() * Math.PI * 2;
    const r = Math.sqrt(Math.random());
    let x = 16 * Math.pow(Math.sin(t), 3);
    let y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    const puff = Math.sqrt(Math.max(0, 1 - r * r));
    base[i*3]   = x * r * .155;
    base[i*3+1] = y * r * .155 - .15;
    base[i*3+2] = (Math.random() * 2 - 1) * puff * 1.05;
    const a = Math.random() * Math.PI * 2, b = Math.acos(rand(-1, 1)), d = rand(4, 9);
    scatter[i*3]   = Math.sin(b) * Math.cos(a) * d;
    scatter[i*3+1] = Math.cos(b) * d * .7;
    scatter[i*3+2] = Math.sin(b) * Math.sin(a) * d;
    const c = cIn.clone().lerp(cOut, Math.min(1, r * .85 + Math.random() * .25));

  if (beats === 1) ringT = 0;                 // nhịp 1: sóng xung kích
  effect = { type: beats, t: 0 };
  if (beats === 2) fireSparks();              // nhịp 2: tỏa hạt sáng
  if (beats >= BEATS) startExplosion();       // nhịp 5: nổ tung
}

/* Nổ tung tim ở nhịp 5 → thiệp lắp ráp từ mảnh vỡ */
function startExplosion() {
  explodeT = 0;
  $("#levelLine").classList.remove("show");
  chime(170, .9, .3);                  // tiếng nổ trầm
  chime(880, .5, .1);                  // loé sáng
  bloomBump = 1.3;
  for (let i = 0; i < 6; i++) setTimeout(fireShooter, i * 90);
}
function twist() {
  if (state !== "main" || phase !== "formed") return;
  phase = "scatter"; phaseT = 0;
  chime(330, .45);
}

$("#introBtn").addEventListener("click", startFlight);

// chạm nhẹ = mở quà / gọi tim / nhịp tim; chạm đôi = xoắn
let downXY = null, lastTap = 0, tapTimer = 0;
renderer.domElement.addEventListener("pointerdown", e => { downXY = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener("pointerup", e => {
  if (!downXY) return;
  const moved = Math.hypot(e.clientX - downXY[0], e.clientY - downXY[1]);
  downXY = null;
  if (moved > 12) return;
  const now = performance.now();
  if (now - lastTap < 320) {
    clearTimeout(tapTimer); lastTap = 0;
    if (state === "main") twist();
    return;
  }
  lastTap = now;
  tapTimer = setTimeout(() => {
    if (!lastTap) return;
    lastTap = 0;
    if (state === "intro") startFlight();
    else beat();
  }, 340);
});

/* Ghép tim từ mây phân tán */
const posAttr = heartGeo.getAttribute("position");
const arr = posAttr.array;
function writeHeart(p, swirl) {
  const e = easeInOut(p);
  for (let i = 0; i < arr.length; i += 3) {
    const bx = base[i], by = base[i+1], bz = base[i+2];
    let x = bx + (scatter[i] - bx) * (1 - e);
    let y = by + (scatter[i+1] - by) * (1 - e);
    let z = bz + (scatter[i+2] - bz) * (1 - e);
    if (e < .999) {
      const a = (1 - e) * (by * 1.8 + swirl);
      const c = Math.cos(a), s = Math.sin(a);
      const nx = x * c - z * s, nz = x * s + z * c;
      x = nx; z = nz;
    }
    arr[i] = x; arr[i+1] = y; arr[i+2] = z;
  }
  posAttr.needsUpdate = true;
}
function updateTwist(dt) {
  if (phase === "formed") return;
  phaseT += dt;
  let p;
  if (phase === "scatter") { p = 1 - easeOut(Math.min(1, phaseT / 1.3)); if (phaseT >= 1.3) { phase = "hold"; phaseT = 0; } }
  else if (phase === "hold") { p = 0; if (phaseT >= 1.1) { phase = "return"; phaseT = 0; } }
  else { p = easeInOut(Math.min(1, phaseT / 1.6)); if (phaseT >= 1.6) { phase = "formed"; p = 1; } }
  twistSpin += dt * 3 * (1 - p);
  writeHeart(p, twistSpin);
}

/* ====== Thư tay + chớp ====== */
function openLetter() {
  $("#letterTo").textContent = `Gửi ${CONFIG.to} ❤️`;
  $("#letterBody").textContent = CONFIG.letter;
  $("#letterSign").textContent = `Thương, ${CONFIG.from} 🌹`;
  if (CONFIG.photos[0]) $("#polaroid").innerHTML = `<div class="photo"><img src="${CONFIG.photos[0]}" alt=""></div>`;
  // gán bay ngẫu nhiên cho từng mảnh — lắp ráp khi hiện thiệp
  document.querySelectorAll(".letter > *").forEach(el => {
    el.style.setProperty("--dx", rand(-170, 170) + "px");
    el.style.setProperty("--dy", rand(-130, 130) + "px");
    el.style.setProperty("--dr", rand(-45, 45) + "deg");
  });
  spawnShards();
  $("#letterModal").classList.add("show");
  chime(660, .6);
}
/* mảnh tim bay từ xung quanh vào giữa — lắp ráp thành thiệp */
function spawnShards() {
  const box = $("#shards");
  box.innerHTML = "";
  for (let i = 0; i < 12; i++) {
    const d = document.createElement("div");
    d.className = "shard";
    const a = rand(0, 6.28), dist = rand(150, 340);
    d.style.marginLeft = rand(-12, 12) + "px";
    d.style.marginTop = rand(-12, 12) + "px";
    d.style.transform = `translate(${Math.cos(a) * dist}px,${Math.sin(a) * dist}px) rotate(${rand(0, 360)}deg)`;
    d.style.transition = `transform .75s cubic-bezier(.3,1,.4,1) ${rand(0, .3)}s, opacity .5s ease ${rand(.3, .6)}s`;
    box.appendChild(d);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      d.style.transform = "translate(0,0) rotate(0deg)";
      d.style.opacity = 0;
    }));
  }
}
function flashToLetter() {
  const f = $("#flash");
  f.style.transition = "opacity .22s ease";
  f.style.opacity = 1;
  setTimeout(openLetter, 280);
  setTimeout(() => { f.style.transition = "opacity .9s ease"; f.style.opacity = 0; }, 520);
}
$("#closeLetter").addEventListener("click", () => {
  $("#letterModal").classList.remove("show");
  // về trạng thái nhịp tim cấp 0 — tim thu nhỏ lại, sẵn sàng nhấn lại từ đầu
  beats = 0;
  effect = { type: 0, t: 9 };
  ringT = 1e9;
  sparks.visible = false;
  heartMat.color.setScalar(1);
  explodeT = -1;
  reformT = 0;                       // hạt từ mảnh nổ tụ lại thành tim
  letterFired = false;
  bloomBump = 0;
  const lf = $("#levelFill");
  lf.style.height = "0%";
  lf.style.setProperty("--lvl", lvlColors[0]);
  $("#levelLine").classList.add("show");
  chime(440, .3);
});

/* ====== Thiệp QR (node 0) ====== */
(function drawHeartQR() {
  const c = $("#qrCanvas"), g = c.getContext("2d");
  const S = 220, N = 21, cell = S / N;
  g.fillStyle = "#fff"; g.fillRect(0, 0, S, S);
  const inHeart = (px, py) => {
    const x = (px - .5) / .42, y = -((py - .42) / .42);
    const a = x * x + y * y - 1;
    return a * a * a - x * x * y * y * y <= 0;
  };
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    if ((i < 7 && j < 7) || (i > N - 8 && j < 7) || (i < 7 && j > N - 8)) continue; // chừa 3 mắt dò
    if (Math.random() > .52) continue;
    const px = (i + .5) / N, py = (j + .5) / N;
    g.fillStyle = inHeart(px, py) ? (Math.random() < .25 ? "#7d0b26" : "#e0264f") : "#1d1218";
    g.fillRect(i * cell + .5, j * cell + .5, cell - 1, cell - 1);
  }
  const eye = (gx, gy) => {
    g.fillStyle = "#1d1218"; g.fillRect(gx * cell, gy * cell, 7 * cell, 7 * cell);
    g.fillStyle = "#fff"; g.fillRect((gx + 1) * cell, (gy + 1) * cell, 5 * cell, 5 * cell);
    g.fillStyle = "#e0264f"; g.fillRect((gx + 2) * cell, (gy + 2) * cell, 3 * cell, 3 * cell);
  };
  eye(0, 0); eye(N - 7, 0); eye(0, N - 7);
})();

/* ====== Vòng lặp ====== */
const clock = new THREE.Clock();
let shooterTimer = .8;
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .05);
  const t = clock.elapsedTime;

  const speedBoost = (state === "flying" || state === "morph" || state === "warp") ? 6 : 1;
  galaxy.rotation.y += dt * .016 * speedBoost;
  stars.rotation.y -= dt * .006 * speedBoost;

  if (state === "qr" || state === "intro" || state === "flying") {
    roseGroup.rotation.y += dt * .15;
    roseGroup.rotation.z = .05 + Math.sin(t * .5) * .03;
  }
  orbitLightA.position.set(Math.cos(t * .7) * 2.4, .8 + Math.sin(t * .9) * .6, Math.sin(t * .7) * 2.4);
  orbitLightB.position.set(Math.cos(t * .5 + 3) * 3, -.4, Math.sin(t * .5 + 3) * 3);
  glowLight.intensity = 9 + Math.sin(t * 2) * 2 + (beatT < 1 ? 16 * Math.sin(Math.min(beatT, 1) * Math.PI) : 0);

  // node 3 — bay vút: nền sáng → tối
  if (state === "flying") {
    flyT += dt / 3;
    const e = easeInOut(Math.min(1, flyT));
    const r = flyFrom.r + (flyTo.r - flyFrom.r) * e;
    const th = flyFrom.theta + (flyTo.theta - flyFrom.theta) * e;
    const ph = flyFrom.phi + (flyTo.phi - flyFrom.phi) * e;
    const h = r * Math.cos(ph);
    camera.position.set(h * Math.sin(th), r * Math.sin(ph) + .15, h * Math.cos(th));
    camera.lookAt(0, .15, 0);
    const fl = Math.min(1, flyT);
    bloom.strength = .2 + fl * .65 + Math.sin(Math.PI * fl) * .45;
    introBackdrop.material.opacity = Math.max(0, 1 - fl / .7);
    if (introBackdrop.material.opacity <= 0) introBackdrop.visible = false;
    if (flyT >= 1) { bloom.strength = .5; startMorph(); }
  }

  // node 3 — cánh hoa xoáy ốc bay lên rồi hội tụ về tâm + hạt tự ghép thành tim
  if (state === "morph") {
    morphT += dt;
    flower.children.forEach(pv => {
      const f = pv.userData.fly;
      if (!f) return;
      const k = Math.min(morphT / 2.6, 1);
      const r = f.r0 + (f.rmax - f.r0) * Math.sin(k * Math.PI);   // nở ra rồi chụm về
      f.a += f.w * dt;
      pv.position.set(Math.cos(f.a) * r, pv.position.y + f.up * dt, Math.sin(f.a) * r);
      pv.rotation.x += f.rx * dt;
      pv.rotation.y += f.ry * dt;
    });
    roseGroup.position.y -= dt * .5;
    const fade = Math.max(0, 1 - morphT / 2.4);
    petalMat.opacity = fade;
    greenMat.opacity = Math.max(0, 1 - morphT / 1.8);
    flower.userData.coreMat.opacity = Math.max(0, 1 - morphT / 1.8);
    beam.quaternion.copy(camera.quaternion);
    beamMat.opacity = Math.min(.28, morphT * 1.1) * Math.max(0, 1 - Math.max(0, morphT - .6) / 1.3);
    const fk = morphT < .5 ? morphT / .5 : Math.max(0, 1 - (morphT - .5) / .9);
    burstFlare.material.opacity = fk * .55;
    burstFlare.scale.setScalar(.5 + morphT * 3);
    updatePolaroidBurst(dt);
    writeHeart(clamp01((morphT - .8) / 1.8), morphT * 1.4);       // hội tụ thành tim — tự động
    heartMat.opacity = Math.min(.95, clamp01((morphT - .8) / 1.1));
    if (morphT > 3.4) startWarp();
  }

  // node warp — phi thuyền lời chúc: bay 4s rồi dừng → panel
  if (state === "warp") {
    warpT += dt;
    heart.rotation.y += dt * .1;
    const cyc = t % 1.4;   // nhịp tim lub-dub
    const hb = Math.exp(-Math.pow((cyc - .12) / .07, 2)) + .6 * Math.exp(-Math.pow((cyc - .38) / .09, 2));
    heartGroup.scale.setScalar(1 + .05 * hb);
    const curve = warpT < 3.2 ? 1 : Math.max(0, 1 - (warpT - 3.2) / .8);
    if (curve > 0) warpItems.forEach(it => {
      it.sp.position.z += it.speed * dt * curve;
      if (it.sp.position.z > -.8) resetWarpItem(it, rand(-60, -45));
    });
    if (warpT >= 4) {
      const fde = Math.min(1, (warpT - 4) / .7);
      warpMats.forEach(m => { m.opacity = .95 * (1 - fde); });
      if (fde >= 1) {
        warpItems.forEach(it => it.sp.visible = false);
        enterPanel();
      }
    }
  }

  // node panel — nhịp tim liên tục, to dần, hiệu ứng riêng từng nhịp; nổ tung ở nhịp 5
  if (state === "main") {
    effect.t += dt;
    heart.rotation.y += dt * .06;
    if (beatT < 1) beatT += dt * 2;
    if (bloomBump > 0) { bloomBump = Math.max(0, bloomBump - dt * 2); bloom.strength = .85 + bloomBump; }
    const cyc = t % 1.4;   // lub-dub: hai nhát tim
    const hb = Math.exp(-Math.pow((cyc - .12) / .07, 2)) + .6 * Math.exp(-Math.pow((cyc - .38) / .09, 2));
    if (explodeT >= 0) {
      // nổ tung: hạt bắn ra xa + phình to + loé sáng rồi mờ dần
      explodeT += dt;
      const p = 1 - easeOut(Math.min(1, explodeT / 1.0));
      writeHeart(p, explodeT * 5);
      heartGroup.scale.setScalar((1 + Math.min(explodeT, .3) * 1.9) * (1 + .05 * hb));
      heartMat.opacity = Math.max(0, .95 - Math.max(0, explodeT - .55) / .75);
      if (explodeT >= 1 && !letterFired) { letterFired = true; flashToLetter(); }
    } else if (reformT >= 0) {
      // đóng thư — hạt tụ về lại thành tim, cấp 0
      reformT += dt;
      const p = easeInOut(Math.min(1, reformT / 1.2));
      writeHeart(p, (1 - p) * 4);
      heartMat.opacity = Math.min(.95, p);
      heartGroup.scale.setScalar(1 + .05 * hb);
      if (reformT >= 1.2) reformT = -1;
    } else {
      let s = (1 + .12 * beats) * (1 + .05 * hb);           // to dần sau mỗi nhịp + đập idle
      if (beatT < 1) s *= 1 + .16 * Math.sin(Math.min(beatT, 1) * Math.PI);
      let sx = 1, sy = 1;
      if (effect.type === 2 && effect.t < 1.2) {            // nhịp 2: hạt tỏa ra
        const p = sparkGeo.getAttribute("position").array;
        for (let i = 0; i < SPARKS * 3; i++) { p[i] += sparkVel[i] * dt; p[i+1] += sparkVel[i+1] * dt; p[i+2] += sparkVel[i+2] * dt; }
        sparkGeo.getAttribute("position").needsUpdate = true;
        sparkMat.opacity = Math.max(0, 1 - effect.t / 1.2);
      } else if (effect.type === 2) sparks.visible = false;
      if (effect.type === 3) {                              // nhịp 3: xoay 360° + sáng bừng
        if (effect.t < .9) heart.rotation.y += dt * 7 * (1 - effect.t / .9);
        heartMat.color.setScalar(1 + 1.1 * Math.max(0, 1 - effect.t / .7));
      } else heartMat.color.setScalar(1);
      if (effect.type === 4 && effect.t < 1) {              // nhịp 4: nảy gel (co giãn)
        const w = Math.exp(-3.5 * effect.t) * Math.cos(effect.t * 15);
        sx = 1 + .2 * w; sy = 1 - .18 * w;
      }
      heartGroup.scale.set(s * sx, s * sy, s * sx);
      updateTwist(dt);
      if (ringT < 1.1) {                                    // nhịp 1: sóng xung kích
        ringT += dt;
        ring.scale.setScalar(1 + (ringT / 1.1) * 4.2);
        ring.material.opacity = .7 * (1 - ringT / 1.1);
      }
    }
    bubbles.forEach(b => {
      const a = t * b.speed + b.ph;
      b.sp.position.set(Math.cos(a) * b.r, .35 + Math.sin(a * 1.3 + b.ph) * .5, Math.sin(a) * b.r * .6);
    });
  }

  // sao băng — dày hơn lúc bay
  shooterTimer -= dt * speedBoost;
  if (shooterTimer <= 0) {
    fireShooter();
    shooterTimer = (state === "intro" || state === "qr") ? rand(1.0, 2.4) : rand(.7, 1.8);
  }
  shooters.forEach(s => {
    if (!s.active) return;
    s.t += dt;
    if (s.t >= s.life) { s.active = false; s.mesh.material.opacity = 0; return; }
    s.mesh.position.addScaledVector(s.dir, s.speed * dt);
    const k = s.t / s.life;
    s.mesh.material.opacity = 1 - k;
    s.flash.material.opacity = Math.max(0, 1 - s.t * 4);
    s.flash.scale.setScalar(Math.min(.5, .08 + s.t * 1.2));
  });

  controls.update();
  composer.render();
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  fitBackdrop();
  flyTo.r = heartFit();
  if (state === "qr" || state === "intro") placeCameraIntro();
  const d = heartFit();
  controls.minDistance = d * .55;
  controls.maxDistance = d * 1.6;
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
