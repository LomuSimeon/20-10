<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>20/10 — Ngày Phụ nữ Việt Nam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ff6fae; --deep:#2b0f3d; --cream:#fdf6ef;
    --serif:"Playfair Display",Georgia,serif;
    --script:"Dancing Script","Segoe Script",cursive;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:var(--serif);background:#1a0626;color:#fff;overflow:hidden}
  .scene{position:fixed;inset:0;opacity:0;pointer-events:none;transition:opacity .9s ease;overflow:hidden}
  .scene.active{opacity:1;pointer-events:auto}
  button{font:inherit;cursor:pointer;border:none}

  /* ---------- Scene 1: intro ---------- */
  #scene-intro{display:grid;place-items:center;
    background:radial-gradient(120% 90% at 50% 15%,#5b2275 0%,#8e2f6e 45%,#c04a7c 78%,#e2748f 100%)}
  .intro-inner{text-align:center;padding:24px;animation:rise 1.4s ease both}
  .rose{font-size:clamp(72px,22vw,130px);line-height:1;display:inline-block;
    filter:drop-shadow(0 0 30px rgba(255,170,210,.95)) drop-shadow(0 0 70px rgba(255,110,180,.6));
    animation:roseGlow 3s ease-in-out infinite}
  .dates{display:flex;justify-content:center;gap:clamp(50px,22vw,140px);margin-top:6px}
  .date small{display:block;font-size:11px;letter-spacing:.42em;opacity:.75;font-family:Arial,sans-serif}
  .date b{font-size:clamp(44px,13vw,72px);font-weight:600;line-height:1.1}
  .script-title{font-family:var(--script);font-size:clamp(34px,9vw,54px);margin-top:clamp(28px,9vh,70px);
    text-shadow:0 2px 24px rgba(255,190,220,.55);line-height:1.25}
  .open-btn{margin-top:clamp(26px,8vh,60px);padding:13px 30px;border-radius:999px;color:#fff;
    background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.45);backdrop-filter:blur(6px);
    font-size:15px;letter-spacing:.05em;animation:breathe 2.2s ease-in-out infinite}
  .open-btn:active{transform:scale(.96)}

  /* ---------- Scene 2: burst ---------- */
  #scene-burst{background:radial-gradient(90% 70% at 50% 45%,#f7d9ee 0%,#e7aede 55%,#c98bd6 100%)}
  .burst-photo{position:absolute;left:50%;top:50%;width:86px;height:104px;border-radius:6px;
    background:linear-gradient(140deg,#c98bd6,#8c5bb0);border:5px solid #fff;box-shadow:0 8px 24px rgba(60,10,80,.35);
    display:grid;place-items:center;font-size:34px;
    transform:translate(-50%,-50%) scale(.2);opacity:0;animation:burst 1.7s ease-out forwards}
  .burst-butterfly{position:absolute;font-size:30px;animation:burst 1.9s ease-out forwards;opacity:0}

  /* ---------- Scene 3: wishes + heart ---------- */
  #scene-wishes{background:radial-gradient(100% 80% at 50% 40%,#150420 0%,#0b0212 70%,#05010a 100%)}
  #stars span{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.7;
    animation:twinkle 3s ease-in-out infinite}
  .wish{position:absolute;font-family:var(--serif);color:#ffb8dd;white-space:nowrap;user-select:none;
    text-shadow:0 0 12px rgba(255,110,180,.9),0 0 30px rgba(255,60,140,.5);
    animation:drift linear infinite alternate}
  .wish.italic{font-style:italic}
  .heart-fly{position:absolute;bottom:-8vh;font-size:22px;pointer-events:none;
    animation:flyUp linear forwards;filter:drop-shadow(0 0 8px rgba(255,80,150,.9))}
  .float-polaroid{position:absolute;width:74px;height:88px;border-radius:5px;background:linear-gradient(140deg,#4a2a63,#7c4a96);
    border:4px solid #fff;opacity:.85;box-shadow:0 6px 18px rgba(0,0,0,.5);animation:sway 6s ease-in-out infinite alternate}
  .float-polaroid i{display:block;width:100%;height:100%;border-radius:2px;
    background:linear-gradient(160deg,#a56bc4,#5e3580);display:grid;place-items:center;font-style:normal;font-size:22px}

  /* heart panel */
  #heartPanel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;opacity:0;transition:opacity 1.2s ease;pointer-events:none;padding:20px}
  #heartPanel.show{opacity:1;pointer-events:auto}
  .occasion{font-size:11px;letter-spacing:.5em;opacity:.7;font-family:Arial,sans-serif}
  .to-line{font-family:var(--script);font-size:clamp(24px,6.5vw,34px);color:#ffd9ec;
    text-shadow:0 0 18px rgba(255,120,190,.7)}
  .heart-wrap{position:relative;width:min(64vw,270px);aspect-ratio:1;display:grid;place-items:center;margin:6px 0}
  .heart-glow{position:absolute;inset:-24%;border-radius:50%;
    background:radial-gradient(circle,rgba(255,120,180,.55) 0%,rgba(255,80,150,.18) 45%,transparent 70%);
    animation:breathe 2.4s ease-in-out infinite}
  #tapHeart{position:relative;background:none;width:78%;transition:transform .18s cubic-bezier(.34,1.6,.64,1)}
  #tapHeart svg{width:100%;height:auto;filter:drop-shadow(0 0 22px rgba(255,140,200,.95))}
  #tapHeart.beat{animation:beat .5s cubic-bezier(.34,1.6,.64,1)}
  .orbit{position:absolute;inset:0;animation:spin 26s linear infinite;pointer-events:none}
  .orbit-item{position:absolute;left:50%;top:50%;width:64px;margin:-32px;pointer-events:auto}
  .orbit-face{width:52px;height:52px;margin:0 auto;border-radius:50%;border:2px solid rgba(255,255,255,.75);
    background:linear-gradient(150deg,#d18ad9,#7a4bb0);display:grid;place-items:center;font-size:22px;
    box-shadow:0 0 16px rgba(255,150,210,.6)}
  .orbit-item small{display:block;text-align:center;font-size:9px;margin-top:3px;color:#ffd9ec;
    text-shadow:0 0 8px rgba(0,0,0,.8);white-space:nowrap}
  .orbit-inner{animation:spin 26s linear reverse infinite}
  .beat-bar{width:min(70vw,300px);height:3px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden}
  .beat-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff8ec4,#ffd2e8);
    transition:width .5s ease;box-shadow:0 0 10px #ff8ec4}
  .beat-hint{font-size:13px;color:#f4c9e2;letter-spacing:.04em;min-height:1.4em;text-align:center}
  .beat-sub{font-size:11px;color:#c79ad4;opacity:.85}

  /* ---------- Letter modal ---------- */
  #letterModal{position:fixed;inset:0;display:grid;place-items:center;padding:18px;z-index:50;
    background:rgba(30,5,45,.55);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .6s ease}
  #letterModal.show{opacity:1;pointer-events:auto}
  .letter{width:min(92vw,430px);max-height:88vh;overflow:auto;background:var(--cream);color:#4a3540;
    border-radius:14px;padding:26px 24px 30px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.5);
    transform:translateY(28px) scale(.96);transition:transform .6s cubic-bezier(.22,1.2,.36,1)}
  #letterModal.show .letter{transform:none}
  .polaroid{width:64%;margin:0 auto 18px;background:#fff;padding:9px 9px 30px;border-radius:4px;
    box-shadow:0 10px 26px rgba(90,50,70,.25);transform:rotate(-2.5deg)}
  .polaroid .photo{aspect-ratio:3/4;border-radius:2px;display:grid;place-items:center;font-size:44px;
    background:linear-gradient(150deg,#e8b7d4,#b47ad0);color:#fff}
  .letter h2{font-family:var(--script);font-size:26px;color:#c2497f;margin-bottom:12px}
  .letter p{font-size:15px;line-height:1.75;font-style:italic;color:#6b4f5e;white-space:pre-line}
  .sign{margin-top:26px;font-family:var(--script);font-size:24px;color:#c2497f}
  .sign small{display:block;font-family:var(--serif);font-size:12px;font-style:normal;color:#a98096;margin-top:4px}
  .close-btn{margin-top:22px;padding:11px 26px;border-radius:999px;background:#c2497f;color:#fff;font-size:14px;
    box-shadow:0 8px 20px rgba(194,73,127,.4)}
  .close-btn:active{transform:scale(.96)}

  /* ---------- keyframes ---------- */
  @keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
  @keyframes roseGlow{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.04)}}
  @keyframes breathe{0%,100%{opacity:.75}50%{opacity:1}}
  @keyframes twinkle{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:.9;transform:scale(1.3)}}
  @keyframes drift{from{transform:translate(0,0)}to{transform:translate(18px,-22px)}}
  @keyframes flyUp{0%{transform:translateY(0) scale(.7);opacity:0}
    12%{opacity:1}100%{transform:translateY(-115vh) scale(1.15);opacity:0}}
  @keyframes burst{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}
    25%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.15) rotate(var(--rot));opacity:0}}
  @keyframes sway{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-16px) rotate(6deg)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes beat{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
  @media (prefers-reduced-motion:reduce){
    .rose,.open-btn,.heart-glow,.orbit,.orbit-inner,#stars span,.wish,.float-polaroid{animation:none!important}
  }
</style>
</head>
<body>

<!-- 1. Mở quà -->
<section id="scene-intro" class="scene active">
  <div class="intro-inner">
    <span class="rose">🌹</span>
    <div class="dates">
      <div class="date"><small>NGÀY</small><b>20</b></div>
      <div class="date"><small>THÁNG</small><b>10</b></div>
    </div>
    <h1 class="script-title">Ngày Phụ nữ<br>Việt Nam</h1>
    <button class="open-btn" id="openBtn">Chạm để mở quà 🎁</button>
  </div>
</section>

<!-- 2. Pháo hoa ảnh -->
<section id="scene-burst" class="scene"><div id="burstLayer"></div></section>

<!-- 3. Lời chúc bay + trái tim -->
<section id="scene-wishes" class="scene">
  <div id="stars"></div>
  <div id="wishLayer"></div>
  <div id="polaroidLayer"></div>

  <div id="heartPanel">
    <span class="occasion">HỘI PHỤ NỮ VIỆT NAM</span>
    <span class="to-line" id="toLine">Gửi Em bé của anh ❤️</span>
    <div class="heart-wrap">
      <div class="heart-glow"></div>
      <div class="orbit" id="orbit"></div>
      <button id="tapHeart" aria-label="Chạm vào trái tim">
        <svg viewBox="0 0 100 90"><defs>
          <radialGradient id="hg" cx="42%" cy="34%" r="75%">
            <stop offset="0%" stop-color="#fff0f7"/><stop offset="45%" stop-color="#ff8ec4"/>
            <stop offset="100%" stop-color="#e0246e"/>
          </radialGradient></defs>
          <path fill="url(#hg)" d="M50 88C20 65 4 46 4 28 4 12 16 4 28 4c10 0 18 6 22 14C54 10 62 4 72 4c12 0 24 8 24 24 0 18-16 37-46 60Z"/>
        </svg>
      </button>
    </div>
    <div class="beat-bar"><i id="beatFill"></i></div>
    <div class="beat-hint" id="beatHint">Chạm vào trái tim 💗</div>
    <div class="beat-sub" id="beatSub"></div>
  </div>
</section>

<!-- 4. Thư tay -->
<div id="letterModal" role="dialog" aria-modal="true" aria-label="Thư tay">
  <div class="letter">
    <div class="polaroid"><div class="photo" id="letterPhoto">💗</div></div>
    <h2 id="letterTo">Gửi Em bé của anh ❤️</h2>
    <p id="letterBody"></p>
    <div class="sign" id="letterSign">Thương!<small id="letterFrom">A Duy của bé</small></div>
    <button class="close-btn" id="closeLetter">Xong! Đóng lại</button>
  </div>
</div>

<script>
/* ====== CẤU HÌNH — sửa ở đây ====== */
const CONFIG = {
  to: "Em bé của anh",
  from: "A Duy của bé",
  wishes: [
    "Chúc em bé mãi xinh đẹp", "Yêu vô nhiều ❤️", "I love u ❤️",
    "Luôn rực rỡ ✨", "20/10 vui vẻ 🎀", "Luôn mỉm cười 😊",
    "Hạnh phúc trọn đời", "Dễ thương nhất vũ trụ 🌸", "20/10 iu veo ❤️"
  ],
  orbit: ["Yêu vô nhiều ❤️", "Luôn rực rỡ ✨", "Xinh đẹp 🌷", "Hạnh phúc 🌸"],
  // Đẩy ảnh thật vào thư mục photos/ rồi điền tên file, ví dụ: ["photos/1.jpg","photos/2.jpg"]
  photos: [],
  letter: "20/10, anh muốn gửi đến em bé cả một chặng thanh xuân dịu dàng nhất của anh.\nCảm ơn em vì đã luôn xuất hiện đúng lúc, chia sẻ từng vui buồn, và khiến mỗi ngày thường đều trở nên có nghĩa.\nChúc em bé của anh luôn rực rỡ, cười thật nhiều, và biết rằng dù đi đâu thì cũng luôn có anh dõi theo ❤️"
};
const BEATS = 3;

const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);

/* ====== Hiệu ứng âm thanh nhẹ (không cần file) ====== */
let audioCtx;
function chime(freq = 660, dur = .25) {
  try {
    audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(.001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.18, audioCtx.currentTime + .02);
    g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (e) { /* không hỗ trợ thì bỏ qua */ }
}

/* ====== Trang sao ====== */
const starsBox = $("#stars");
for (let i = 0; i < 90; i++) {
  const s = document.createElement("span");
  s.style.cssText = `left:${rand(0, 100)}%;top:${rand(0, 100)}%;animation-delay:${rand(0, 3)}s;animation-duration:${rand(2, 4.5)}s`;
  starsBox.appendChild(s);
}

/* ====== Lời chúc bay ====== */
const wishLayer = $("#wishLayer");
CONFIG.wishes.forEach((text, i) => {
  const w = document.createElement("div");
  w.className = "wish" + (i % 3 === 0 ? " italic" : "");
  w.textContent = text;
  w.style.cssText = `left:${rand(2, 58)}%;top:${rand(4, 92)}%;font-size:${rand(13, 26)}px;` +
    `animation-duration:${rand(5, 11)}s;animation-delay:${rand(0, 4)}s;opacity:${rand(.6, 1)}`;
  wishLayer.appendChild(w);
});

/* ====== Polaroid trôi ====== */
const polaroidLayer = $("#polaroidLayer");
const polaroidPos = [[10, 14], [72, 10], [18, 68], [78, 62], [44, 34]];
polaroidPos.forEach(([x, y], i) => {
  const p = document.createElement("div");
  p.className = "float-polaroid";
  p.style.cssText = `left:${x}%;top:${y}%;animation-delay:${i * .8}s`;
  p.innerHTML = `<i>${CONFIG.photos[i] ? `<img src="${CONFIG.photos[i]}" alt="" style="width:100%;height:100%;object-fit:cover">` : ["📷", "🌸", "💗", "🎀", "🌷"][i]}</i>`;
  polaroidLayer.appendChild(p);
});

/* ====== Quỹ đạo quanh tim ====== */
const orbit = $("#orbit");
orbit.className = "orbit";
CONFIG.orbit.forEach((label, i) => {
  const item = document.createElement("div");
  item.className = "orbit-item";
  const ang = i * (360 / CONFIG.orbit.length);
  item.style.transform = `rotate(${ang}deg) translateY(-42vmin) rotate(${-ang}deg)`;
  item.innerHTML = `<div class="orbit-inner"><div class="orbit-face">${["💐", "✨", "🌷", "🌸"][i % 4]}</div><small>${label}</small></div>`;
  orbit.appendChild(item);
});

/* ====== Nhịp tim ====== */
let beats = 0;
const hints = ["Chạm vào trái tim 💗", "1/3 nhịp tim", "2/3 nhịp tim", "3/3 nhịp tim ❤️ mở thư..."];
const subs = ["", "Thêm hai nhịp nữa thôi", "Thêm một nhịp nữa thôi ❤️"];
$("#tapHeart").addEventListener("click", () => {
  if (beats >= BEATS) return;
  beats++;
  chime(520 + beats * 140, .3);
  const btn = $("#tapHeart");
  btn.classList.remove("beat"); void btn.offsetWidth; btn.classList.add("beat");
  $("#beatFill").style.width = (beats / BEATS * 100) + "%";
  $("#beatHint").textContent = hints[beats];
  $("#beatSub").textContent = subs[beats];
  if (beats >= BEATS) setTimeout(openLetter, 700);
});

/* ====== Chuyển cảnh ====== */
function show(id) {
  document.querySelectorAll(".scene").forEach(s => s.classList.toggle("active", s.id === id));
}

$("#openBtn").addEventListener("click", () => {
  chime(880, .35);
  // quảnh ảnh bay ra
  const layer = $("#burstLayer");
  layer.innerHTML = "";
  for (let i = 0; i < 10; i++) {
    const d = document.createElement("div");
    d.className = i < 3 ? "burst-butterfly" : "burst-photo";
    if (d.className === "burst-butterfly") d.textContent = "🦋";
    else {
      d.textContent = ["💗", "🌸", "🌷", "📷", "🎀", "💐", "✨"][i - 3] || "💗";
      if (CONFIG.photos[i - 3]) { d.textContent = ""; d.style.background = `center/cover url(${CONFIG.photos[i - 3]})`; }
    }
    const ang = rand(0, Math.PI * 2), dist = rand(35, 75);
    d.style.setProperty("--dx", Math.cos(ang) * dist + "vmax");
    d.style.setProperty("--dy", Math.sin(ang) * dist + "vmax");
    d.style.setProperty("--rot", rand(-50, 50) + "deg");
    d.style.animationDelay = (i * .06) + "s";
    layer.appendChild(d);
  }
  show("scene-burst");
  setTimeout(() => {
    show("scene-wishes");
    setTimeout(() => $("#heartPanel").classList.add("show"), 6000);
  }, 1700);
});

/* ====== Thư tay ====== */
function openLetter() {
  $("#letterTo").textContent = `Gửi ${CONFIG.to} ❤️`;
  $("#letterBody").textContent = CONFIG.letter;
  $("#letterFrom").textContent = CONFIG.from;
  if (CONFIG.photos[0]) $("#letterPhoto").innerHTML = `<img src="${CONFIG.photos[0]}" alt="" style="width:100%;height:100%;object-fit:cover">`;
  $("#letterModal").classList.add("show");
  chime(660, .6);
}
$("#closeLetter").addEventListener("click", () => {
  $("#letterModal").classList.remove("show");
  chime(440, .3);
});

/* ====== Trái tim bay trong nền ====== */
setInterval(() => {
  if (!$("#scene-wishes").classList.contains("active")) return;
  const h = document.createElement("span");
  h.className = "heart-fly";
  h.textContent = Math.random() < .3 ? "✨" : "💗";
  h.style.left = rand(2, 94) + "%";
  h.style.fontSize = rand(14, 30) + "px";
  h.style.animationDuration = rand(6, 11) + "s";
  $("#scene-wishes").appendChild(h);
  h.addEventListener("animationend", () => h.remove());
}, 900);
</script>
</body>
</html>
